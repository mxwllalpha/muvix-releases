changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 New Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: ⚡ Performance
      labels:
        - performance
        - optimize
    - title: 🛠 Maintenance
      labels:
        - chore
        - refactor
    - title: 📦 Other Changes
      labels:
        - "*"
