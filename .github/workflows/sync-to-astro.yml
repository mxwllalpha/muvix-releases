name: Sync Release to Muvix Astro

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muvix-astro
    steps:
      - name: Checkout muvix-astro
        uses: actions/checkout@v4
        with:
          repository: mxwllalpha/muvix-astro
          token: ${{ secrets.ASTRO_REPO_PAT }}
          path: muvix-astro

      - name: Write release metadata
        env:
          RELEASE_JSON: ${{ toJson(github.event.release) }}
        run: |
          mkdir -p public/data
          echo "$RELEASE_JSON" | node -e '
            const fs = require("fs");
            const release = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const asset = release.assets.find(a => a.name.endsWith(".apk"));
            if (!asset) {
              console.error("No APK asset found in release");
              process.exit(1);
            }
            const version = release.tag_name.replace(/^v/, "");
            const [major = 0, minor = 0, patch = 0] = version.split(".").map(Number);
            const versionCode = major * 10000 + minor * 100 + patch;
            const data = {
              versionCode,
              versionName: version,
              forceUpdate: false,
              apkUrl: asset.browser_download_url,
              releaseNotes: release.body || "",
              apkSize: asset.size
            };
            fs.writeFileSync("public/data/update.json", JSON.stringify(data, null, 2));
          '

      - name: Commit and push
        run: |
          git config user.name "Muvix Bot"
          git config user.email "bot@muvix.org"
          git add public/data/update.json
          git diff --staged --quiet || git commit -m "chore: sync release v$(jq -r '.versionName' public/data/update.json)"
          git push
